{% extends 'base.html' %}  {# Or the layout you use #}

{% block main_content %}
<div class="container my-4">
  <h3>Search Results for "{{ query }}"</h3>
  <div class="row">
    {% if results %}
      {% for product in results %}
        <div class="col-md-3 mb-4">
          <div class="card h-100">
            <img src="{{ product.product_image.url }}" class="card-img-top" alt="{{ product.title }}">
            <div class="card-body">
              <h5 class="card-title">{{ product.title }}</h5>
              <p class="card-text">₹ {{ product.sellong_price }}</p>
              <a href="{% url 'product-detail' product.id %}" class="btn btn-primary">View</a>
            </div>
          </div>
        </div>
      {% endfor %}
    {% else %}
      <p>No products found.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
